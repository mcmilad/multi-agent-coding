name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dev dependencies
        run: python -m pip install --no-input -r requirements-dev.txt
      - name: Secret scan (tracked files)
        run: python -m pytest tests/test_no_tracked_credentials.py
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -n auto
